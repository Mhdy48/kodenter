<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"

    />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <!-- Logo Section -->
      <div class="header__logo">

        <div class="header__logo__title">
          <h2>کدنتر</h2>
          <p>آموزش طراحی سایت</p>
        </div>
        <!-- Logo Icon -->
        <div class="header__logo__icon">

        </div>
      </div>
      <!-- Navigation Section -->
      <nav class="header__nav">
        <!-- Mobile Menu Icon -->
        <i class="fa-solid fa-bars"></i>
        <!-- Navigation Links -->
        <ul class="nav__list">
          <li class="nav__item"><a href="#">خانه</a></li>
          <li class="nav__item"><a href="#">دوره ها</a></li>
          <li class="nav__item"><a href="#">امکانات</a></li>
          <li class="nav__item"><a href="#">نمونه کارها</a></li>
          <li class="nav__item"><a href="#">درباره ما</a></li>
          <li class="nav__item"><a href="#">تماس با ما</a></li>
        </ul>
      </nav>
      <!-- Authentication Button -->
      <div class="header__actions">
        <!-- User Icon -->
        <i class="fa fa-user"></i>
        <!-- Login / Register Link -->
        <a href="#"> ورود / ثبت نام </a>
      </div>
    </header>
  </body>
</html>
