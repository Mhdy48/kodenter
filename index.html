<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <!-- Logo Section -->
      <div class="header__logo">
        <!-- Logo Text -->
        <div class="header__logo__title">
          <h2>کدنتر</h2>
          <p>آموزش طراحی سایت</p>
        </div>
        <!-- Logo Icon -->
        <div class="header__logo__icon">
          <i class="fa fa-code"></i>
        </div>
      </div>
      <!-- Navigation Section -->
      <nav class="header__nav">
        <!-- Mobile Menu Icon -->
        <i class="fa-solid fa-bars"></i>
        <!-- Navigation Links -->
        <ul class="nav__list">
          <li class="nav__item"><a href="#">خانه</a></li>
          <li class="nav__item"><a href="#">دوره ها</a></li>
          <li class="nav__item"><a href="#">امکانات</a></li>
          <li class="nav__item"><a href="#">نمونه کارها</a></li>
          <li class="nav__item"><a href="#">درباره ما</a></li>
          <li class="nav__item"><a href="#">تماس با ما</a></li>
        </ul>
      </nav>
      <!-- Authentication Button -->
      <div class="header__actions">
        <!-- User Icon -->
        <i class="fa fa-user"></i>
        <!-- Login / Register Link -->
        <a href="#"> ورود / ثبت نام </a>
      </div>
    </header>
    <section class="hero">
      <!-- Hero Section Content -->
      <div class="hero__content">
        <!-- Hero Text Content -->
        <div class="hero__info">
          <!-- Top Badge -->
          <h2 class="hero__title-top">
            <i class="fa fa-rocket"></i>از صفر تا حرفه ای
          </h2>
          <!-- Main Hero Title -->
          <h1 class="hero__title-main">
            طراحی سایت رو <span>حرفه ای</span> یاد بگیر!
          </h1>
          <!-- Hero Description Text -->
          <p class="hero__description">
            با دوره های پروژه محور ما، از مبانی HTML و CSS تا ساخت سایت های حرفه
            ای و ورود به بازار کار را تجربه کن.
          </p>
          <!-- Hero Action Buttons -->
          <div class="hero__buttons">
            <a class="btn" href="#"
              >شروع دوره<i class="fa fa-arrow-left"></i>
            </a>
            <a class="btn" href="#">
              مشاهده دوره
              <i class="fa fa-arrow-left"></i>
            </a>
          </div>
        </div>
        <!-- Hero Illustration -->
        <div class="hero__image">
          <img src="picture/web.png" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
